name: Terraform infrastructure

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-infrastructure
  cancel-in-progress: false

jobs:
  data-lake:
    name: Deploy CloudFormation data lake
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SECRET_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Set up AWS SAM
        uses: aws-actions/setup-sam@v3
        with:
          use-installer: true

      - name: Deploy CloudFormation stack
        run: >-
          sam deploy
          --no-confirm-changeset
          --no-fail-on-empty-changeset
          --resolve-s3
          --stack-name infra-pilates-data-lake
          --template-file cloudformation/data-lake.yml
          --region us-east-1

  plan:
    name: Terraform plan
    runs-on: ubuntu-latest
    environment: development
    needs: data-lake

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SECRET_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.6
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Configure Terraform state bucket
        run: echo "TF_STATE_BUCKET=infra-pilates-bronze-$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_ENV"

      - name: Initialize Terraform
        run: terraform init -input=false -backend-config="bucket=$TF_STATE_BUCKET"

      - name: Validate Terraform
        run: terraform validate

      - name: Create plan
        run: terraform plan -input=false -out=tfplan

      - name: Summarize plan changes
        run: |
          terraform show -json tfplan | jq -r '
            .resource_changes[]
            | select(.change.actions != ["no-op"])
            | "- " + (.change.actions | join(", ")) + " " + .address
          ' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload saved plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ github.sha }}
          path: tfplan
          if-no-files-found: error
          retention-days: 1

  apply:
    name: Apply plan automatically
    runs-on: ubuntu-latest
    needs: plan
    environment: development

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SECRET_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.6
          terraform_wrapper: false

      - name: Configure Terraform state bucket
        run: echo "TF_STATE_BUCKET=infra-pilates-bronze-$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_ENV"

      - name: Initialize Terraform
        run: terraform init -input=false -backend-config="bucket=$TF_STATE_BUCKET"

      - name: Download saved plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-${{ github.sha }}
          path: .

      - name: Apply plan
        run: terraform apply -input=false -auto-approve tfplan
