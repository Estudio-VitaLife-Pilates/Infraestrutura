services:
  backend:
    image: $${BACKEND_IMAGE:?BACKEND_IMAGE must be set}
    container_name: pilates-backend
    restart: "no"
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://$${DATABASE_HOST:?DATABASE_HOST must be set}:3306/pilates
      DB_USERNAME: pilates_app
      DB_PASSWORD: root
      JWT_SECRET: ""
      JWT_VALIDITY: "3600"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: pilates
      RABBITMQ_PASSWORD: pilates-rabbit-2026
    depends_on:
      rabbitmq:
        condition: service_started

  rabbitmq:
    image: rabbitmq:4-management
    container_name: pilates-rabbitmq
    restart: unless-stopped
    ports:
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: pilates
      RABBITMQ_DEFAULT_PASS: pilates-rabbit-2026
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

volumes:
  rabbitmq-data:
