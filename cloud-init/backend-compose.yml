services:
  backend:
    image: $${BACKEND_IMAGE:?BACKEND_IMAGE must be set}
    container_name: pilates-backend
    restart: "no"
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://$${DATABASE_HOST:?DATABASE_HOST must be set}:3306/pilates
      DB_USERNAME: pilates_app
      DB_PASSWORD: root
      JWT_SECRET: ""
      JWT_VALIDITY: "3600"
